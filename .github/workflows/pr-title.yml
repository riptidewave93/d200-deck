name: PR title

# Pull requests are squash-merged with their title as the commit message,
# which Release Drafter reads for the notes and the version: it must be a
# conventional commit, such as "feat(deckd): ..." or "fix(gfx): ...".
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-26.04
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
