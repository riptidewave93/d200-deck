name: Release

# Checks, tests and builds deckhost's installers (Linux .deb, .rpm and
# tarballs for amd64 and arm64; Windows setup.exe). Called by Release Please
# for a new release, it attaches them with their SHA-256 sums to that
# release; run by hand, it keeps them as artifacts.
on:
  workflow_call:
    inputs:
      tag:
        description: The release to attach the installers to
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0  # the version comes from git describe

      - name: Check and test
        run: make check test

      - name: Build the installers
        run: make dist

      - name: Check they carry the release's version
        if: inputs.tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          test "$(build/linux-amd64/deckhost version)" = "$TAG"
          test -e "build/dist/deckhost-${TAG#v}-windows-amd64-setup.exe"

      - name: Checksums
        run: cd build/dist && sha256sum -- * > SHA256SUMS

      - name: Attach them to the release
        if: inputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        # SHA256SUMS goes last: deckhost waits for it before telling users.
        run: |
          shopt -s extglob
          cd build/dist
          gh release upload "$TAG" !(SHA256SUMS)
          gh release upload "$TAG" SHA256SUMS

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.tag }}
        with:
          name: deckhost-${{ github.sha }}
          path: build/dist/*
