name: Release

# On a version tag: check, test and build deckhost's installers (Linux .deb,
# .rpm and tarballs for amd64 and arm64; Windows setup.exe), and attach them
# with their SHA-256 sums to a draft GitHub release. Run by hand, it keeps
# them as artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the version comes from git describe

      - name: Check and test
        run: make check test

      - name: Build the installers
        run: make dist

      - name: Checksums
        run: cd build/dist && sha256sum * > SHA256SUMS

      - name: Draft a GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" build/dist/*

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: deckhost-${{ github.sha }}
          path: build/dist/*
