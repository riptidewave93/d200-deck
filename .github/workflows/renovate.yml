name: Renovate

# Self-hosted Renovate for the D200 repos, as the project's GitHub App: every
# Monday, by hand, and after each release (the Release workflow calls it).
# Each repo's renovate.json says what it updates.
on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    # skipped until the app is set up
    if: vars.BOT_CLIENT_ID != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Get a token for the app
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          repositories: d200-deck,d200-buildroot,d200-configure

      - uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ steps.token.outputs.token }}
          renovate-version: 44.176.3
        env:
          RENOVATE_REPOSITORIES: riptidewave93/d200-deck,riptidewave93/d200-buildroot,riptidewave93/d200-configure
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
