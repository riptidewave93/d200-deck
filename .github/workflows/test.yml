name: Test

# On pull requests and pushes to main: format, vet, unit tests, and the
# website's packages built and tested with TinyGo; on a Mac, deckhost's vet,
# tests and build, the binary and the zipped app kept for testing by hand.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check
        run: make check

      - name: Test
        run: make test

      - name: Test with TinyGo
        run: make tinygo

  macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: make test-macos

      - name: Build
        run: make dist-macos

      - uses: actions/upload-artifact@v4
        with:
          name: deckhost-macos
          path: build/deckhost-macos

      - uses: actions/upload-artifact@v4
        with:
          name: deckhost-macos-app
          path: build/dist/*-macos-arm64.zip
