<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D200 Update</title>
<style>
:root { --bg: #f6f6f4; --card: #fff; --fg: #1c1c1c; --muted: #666; --line: #ddd; --accent: #2f6fde; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #121212; --card: #1c1c1c; --fg: #e8e8e8; --muted: #9a9a9a; --line: #333; --accent: #6b9cf0; }
}
* { box-sizing: border-box; }
body { margin: 0; padding: 48px 16px; background: var(--bg); color: var(--fg);
  font: 16px/1.5 system-ui, sans-serif; }
main { max-width: 520px; margin: 0 auto; background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; padding: 28px; }
h1 { margin: 0 0 20px; font-size: 22px; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0 0 24px; }
dt { color: var(--muted); }
dd { margin: 0; font-family: ui-monospace, monospace; overflow-wrap: anywhere; }
fieldset { border: 1px dashed var(--line); border-radius: 8px; padding: 16px; margin: 0 0 16px; }
legend { color: var(--muted); padding: 0 6px; }
input, button { font: inherit; }
button { margin-top: 12px; padding: 8px 16px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; }
button:disabled, input:disabled { opacity: .45; }
p { margin: 0; color: var(--muted); }
a { color: var(--accent); }
</style>
</head>
<body>
<main>
<h1>D200 Update</h1>
<dl>
  <dt>Installed</dt><dd>{version}</dd>
  <dt>Flavour</dt><dd>{flavour}</dd>
  <dt>Built</dt><dd>{build}</dd>
</dl>
<fieldset disabled>
  <legend>Update file</legend>
  <input type="file" accept=".tar,.gz">
  <br><button>Install</button>
</fieldset>
<p>Updating from this page isn't available yet. To update now, flash over USB with fastboot:
see <a href="https://github.com/riptidewave93/d200-buildroot/blob/main/docs/flashing.md">flashing.md</a>.</p>
</main>
</body>
</html>
